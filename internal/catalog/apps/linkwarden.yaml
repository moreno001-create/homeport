id: linkwarden
name: Linkwarden
description: Save, organise and share links, with a full copy of each page kept so it never disappears.
category: Documents & productivity
website: https://linkwarden.app
signIn: gate
secrets: [db_password, nextauth_secret]
notes: |
  Open it and register the first account. Only the groups you allow can reach it.
compose: |
  services:
    app:
      image: ghcr.io/linkwarden/linkwarden:latest
      ports: ["127.0.0.1:{{.Port}}:3000"]
      environment:
        DATABASE_URL: "postgresql://linkwarden:{{secret "db_password"}}@db:5432/linkwarden"
        NEXTAUTH_SECRET: "{{secret "nextauth_secret"}}"
        NEXTAUTH_URL: "https://{{.Domain}}/api/v1/auth"
      volumes: ["{{.Data}}/data:/data/data"]
      depends_on: [db]
      restart: unless-stopped
    db:
      image: docker.io/library/postgres:17-alpine
      environment:
        POSTGRES_DB: linkwarden
        POSTGRES_USER: linkwarden
        POSTGRES_PASSWORD: "{{secret "db_password"}}"
      volumes: ["{{.Data}}/postgres:/var/lib/postgresql/data"]
      restart: unless-stopped
