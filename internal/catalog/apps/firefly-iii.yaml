id: firefly-iii
name: Firefly III
description: "Personal finances in detail: accounts, budgets, bills, categories and reports."
category: Documents & productivity
website: https://www.firefly-iii.org
signIn: gate
secrets: [app_key, db_password]
notes: |
  Open it and register the first account (it becomes the owner). Only the groups you allow can reach it.
compose: |
  services:
    init:
      image: docker.io/library/busybox:1.37
      command: ["chown", "-R", "33:33", "/upload"]
      volumes: ["{{.Data}}/upload:/upload"]
    app:
      image: docker.io/fireflyiii/core:latest
      ports: ["127.0.0.1:{{.Port}}:8080"]
      environment:
        APP_KEY: "{{secret "app_key"}}"
        APP_URL: "https://{{.Domain}}"
        TRUSTED_PROXIES: "**"
        TZ: "{{.TimeZone}}"
        DB_CONNECTION: pgsql
        DB_HOST: db
        DB_PORT: "5432"
        DB_DATABASE: firefly
        DB_USERNAME: firefly
        DB_PASSWORD: "{{secret "db_password"}}"
      volumes: ["{{.Data}}/upload:/var/www/html/storage/upload"]
      depends_on:
        db: {condition: service_started}
        init: {condition: service_completed_successfully}
      restart: unless-stopped
    db:
      image: docker.io/library/postgres:17-alpine
      environment:
        POSTGRES_DB: firefly
        POSTGRES_USER: firefly
        POSTGRES_PASSWORD: "{{secret "db_password"}}"
      volumes: ["{{.Data}}/postgres:/var/lib/postgresql/data"]
      restart: unless-stopped
